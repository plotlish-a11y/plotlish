name: Plotlish Beta - 自动部署到测试站

on:
  push:
    branches: [beta]
    paths:
      - 'beta-app/**'
      - 'course-packages/**'
      - '.github/workflows/plotlish-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotlish-beta-pages-production
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout shared repo beta branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run core regression tests
        working-directory: beta-app
        run: python -m unittest discover -s tests -p test_build.py -v
      - name: Build published books from independent course-packages
        working-directory: beta-app
        run: python tools/build.py --packages-dir ../course-packages
      - name: Verify site and independent course catalog (empty catalog permitted)
        working-directory: beta-app
        run: python tools/verify_beta_site.py
      - name: Verify Cloudflare account and actual production branch
        working-directory: beta-app
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN_BETA: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID_BETA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_BETA }}
        run: python tools/check_beta_cloudflare_target.py
      - name: Deploy to existing plotlish-test Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_BETA }}
          PAGES_PRODUCTION_BRANCH: ${{ steps.cloudflare.outputs.production_branch }}
        run: |
          test -n "$PAGES_PRODUCTION_BRANCH"
          npx --yes wrangler@4 pages deploy beta-app/dist \
            --project-name=plotlish-test \
            --branch="$PAGES_PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA"
      - name: Compare live catalog to the exact package build
        shell: bash
        run: |
          python - <<'PYVERIFY'
          import json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          expected=json.loads(Path('beta-app/dist/courses/catalog.json').read_text(encoding='utf-8'))
          expected_chapters={c['chapter_id'] for c in expected.get('chapters',[])}
          expected_books=set(expected.get('books',{}))
          url='https://plotlish-test.pages.dev/courses/catalog.json?verify='+os.environ['GITHUB_SHA']
          last='not checked'
          for attempt in range(1,13):
              try:
                  request=Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Plotlish-Beta-Deploy-Verify/2.0'})
                  with urlopen(request,timeout=15) as response: actual=json.load(response)
                  actual_chapters={c['chapter_id'] for c in actual.get('chapters',[])}
                  actual_books=set(actual.get('books',{}))
                  if actual_chapters==expected_chapters and actual_books==expected_books:
                      print('VERIFIED:',len(actual_books),'published books and',len(actual_chapters),'chapters')
                      break
                  last=f'expected {sorted(expected_chapters)}, got {sorted(actual_chapters)}'
              except Exception as exc: last=f'{type(exc).__name__}: {exc}'
              print(f'Attempt {attempt}: {last}')
              if attempt<12: time.sleep(8)
          else: raise SystemExit('Deployment unverified: '+last)
          PYVERIFY
      - name: Deployment summary
        run: |
          echo '### Plotlish Beta deployed and catalog verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://plotlish-test.pages.dev/#stories' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://plotlish-test.pages.dev/courses/catalog.json' >> "$GITHUB_STEP_SUMMARY"
